<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Links</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-dark shadow">

<div class="container">

<a href="/wallet" class="btn btn-dark">
<i class="bi bi-arrow-left"></i>
</a>

<h5 class="m-0">
🔗 All Links
</h5>

<div></div>

</div>

</nav>

<div class="container py-4">

{% if links %}

{% for link in links %}

<div class="card bg-secondary bg-opacity-25 border-0 shadow mb-4">

<div class="card-body">

<h6 class="text-info">

{{ request.host_url }}{{ link.code }}

</h6>

<hr>

<div class="row text-center">

<div class="col-4">

<h6>{{ link.clicks }}</h6>

<small class="text-secondary">

Clicks

</small>

</div>

<div class="col-4">

<h6>${{ "%.2f"|format(link.earnings) }}</h6>

<small class="text-secondary">

Earnings

</small>

</div>

<div class="col-4">

<h6>{{ link.ads }}</h6>

<small class="text-secondary">

Ads

</small>

</div>

</div>

<div class="d-grid gap-2 mt-4">

<button

class="btn btn-primary copyBtn"

onclick="copyLink(this,'{{ request.host_url }}{{ link.code }}')">

<i class="bi bi-clipboard"></i>

Copy

</button>

<button

class="btn btn-danger"

onclick="showDelete('{{ link._id }}')">

<i class="bi bi-trash"></i>

Delete

</button>

</div>

</div>

</div>

{% endfor %}

{% else %}

<div class="card bg-secondary bg-opacity-25">

<div class="card-body text-center">

<h5>No Links Found</h5>

<p class="text-secondary">

Generate your first link.

</p>

<a href="/generate" class="btn btn-success">

Generate Link

</a>

</div>

</div>

{% endif %}

  </div>
