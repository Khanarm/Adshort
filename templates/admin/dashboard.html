<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#111827;
color:white;
font-family:Arial,sans-serif;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:230px;
height:100vh;
background:#1f2937;
padding-top:20px;
}

.sidebar h3{
text-align:center;
margin-bottom:30px;
color:#f59e0b;
}

.sidebar a{
display:block;
padding:14px 20px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#374151;
}

.main{
margin-left:230px;
padding:25px;
}

.card-box{
background:#1f2937;
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

.card-title{
font-size:15px;
color:#9ca3af;
}

.card-value{
font-size:32px;
font-weight:bold;
margin-top:8px;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>Admin Panel</h3>

<a href="/admin/dashboard">📊 Dashboard</a>
<a href="/admin/users">👥 Users</a>
<a href="/admin/links">🔗 Links</a>
<a href="/admin/plans">📦 Plans</a>
<a href="/admin/withdraw">💰 Withdraw</a>
<a href="/admin/settings">⚙️ Settings</a>
<a href="/admin/logout">🚪 Logout</a>

</div>

<div class="main">

<h2 class="mb-4">Dashboard</h2>

<div class="row">

<div class="col-md-4">

<div class="card-box">
<div class="card-title">👥 Total Users</div>
<div class="card-value">{{ total_users }}</div>
</div>

</div>

<div class="col-md-4">

<div class="card-box">
<div class="card-title">🔗 Total Links</div>
<div class="card-value">{{ total_links }}</div>
</div>

</div>

<div class="col-md-4">

<div class="card-box">
<div class="card-title">👆 Total Clicks</div>
<div class="card-value">{{ total_clicks }}</div>
</div>

</div>

<div class="col-md-6">

<div class="card-box">
<div class="card-title">💰 Total Earnings</div>
<div class="card-value">₹{{ total_earnings }}</div>
</div>

</div>

<div class="col-md-6">

<div class="card-box">
<div class="card-title">💸 Pending Withdraw</div>
<div class="card-value">{{ pending_withdraw }}</div>
</div>

</div>

</div>

</div>

</body>
</html>
