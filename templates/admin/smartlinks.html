<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Links</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#111827;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:1100px;
margin-top:30px;
}

.card{
background:#1f2937;
border:none;
border-radius:15px;
}

.table{
color:white;
}

.table td,
.table th{
vertical-align:middle;
}

.form-control{
background:#374151;
border:none;
color:white;
}

.form-control:focus{
background:#374151;
color:white;
box-shadow:none;
}

</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">
🔗 Smart Links Manager
</h2>

<div class="card p-4 mb-4">

<form action="/admin/smartlinks/add" method="POST">

<div class="row">

<div class="col-md-4">
<input
type="text"
name="name"
class="form-control"
placeholder="Link Name"
required>
</div>

<div class="col-md-6">
<input
type="url"
name="url"
class="form-control"
placeholder="https://..."
required>
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">
Add
</button>
</div>

</div>

</form>

</div>

<div class="card p-4">

<table class="table table-dark table-hover">

<thead>

<tr>

<th>Name</th>

<th>Status</th>

<th>Clicks</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for link in smartlinks %}

<tr>

<td>{{ link.name }}</td>

<td>

{% if link.status %}

<span class="badge bg-success">
Active
</span>

{% else %}

<span class="badge bg-danger">
Inactive
</span>

{% endif %}

</td>

<td>

{{ link.clicks }}

</td>

<td>

<a
href="/admin/smartlinks/toggle/{{ link._id }}"
class="btn btn-warning btn-sm">

Toggle

</a>

<a
href="/admin/smartlinks/delete/{{ link._id }}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

  </html>
