<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Unlock 2 Earn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    color:#f59e0b;
    font-size:28px;
    font-weight:bold;
    margin-bottom:25px;
}

.form-control{
    height:50px;
    background:#334155;
    border:none;
    color:#fff;
}

.form-control:focus{
    background:#334155;
    color:#fff;
    box-shadow:none;
}

.btn-login{
    width:100%;
    height:50px;
    background:#f59e0b;
    color:#000;
    font-weight:bold;
    border:none;
}

.btn-login:hover{
    background:#d97706;
}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">
🔐 Admin Panel
</div>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-danger">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">
<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>
</div>

<div class="mb-3">
<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>
</div>

<button class="btn btn-login">
Login
</button>

</form>

</div>

</body>
  </html>
