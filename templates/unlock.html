<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unlock 2 Earn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

.container-box{
    max-width:420px;
    margin:30px auto;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.card-box{
    background:#1f2937;
    border-radius:15px;
    padding:20px;
}

.progress{
    height:12px;
    border-radius:20px;
}

.step-text{
    text-align:center;
    margin-top:10px;
    margin-bottom:20px;
    color:#cbd5e1;
}

.watch-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.active-btn{
    background:#0d6efd;
    color:white;
}

.lock-btn{
    background:#374151;
    color:#9ca3af;
}

.complete-btn{
    background:#16a34a;
    color:white;
}

.final-btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:12px;
    background:#229ED9;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.small-text{
    display:block;
    font-size:13px;
    opacity:.9;
}

.list-group-item{
    background:#1f2937;
    color:white;
    border:1px solid #374151;
}

.list-group-item:hover{
    background:#374151;
    color:white;
}

.final-btn:disabled{
    background:#475569;
    cursor:not-allowed;
    opacity:.7;
}

/* Processing Animation */

.processing-btn{

    animation:ring 1s linear infinite;

}

@keyframes ring{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

</style>

</head>

<body>

<div class="container-box">

<div class="d-flex justify-content-between align-items-center mb-4">

<a href="/register" class="btn btn-primary btn-sm">
Signup
</a>

<div class="logo m-0">
🔓 Unlock 2 Earn
</div>

<div style="width:70px;"></div>

</div>

<div class="card-box">

<div class="progress">

<div
id="progressBar"
class="progress-bar bg-primary"
style="width:0%">
</div>

</div>

<div class="step-text">

Step
<span id="step">1</span>
of
<span id="total">{{ ads }}</span>

</div>

{% for i in range(1, ads + 1) %}

<button

id="btn{{ i }}"

class="watch-btn {% if i == 1 %}active-btn{% else %}lock-btn{% endif %}"

{% if i != 1 %}disabled{% endif %}>

{% if i == 1 %}
▶ WATCH NOW
{% else %}
🔒 WATCH NOW
{% endif %}

</button>

{% endfor %}

<button
id="finalButton"
class="final-btn"
disabled>

➡️ DIRECTION

<span class="small-text">

{{ platform|title }} • {{ action_name }}

</span>

</button>

<p class="text-center text-secondary mt-2">
Complete all ads to continue.
</p>

</div>

<div class="card-box mt-4">

<h5 class="mb-3">🌳 Tree Links</h5>

<div class="list-group">

<a href="/terms" class="list-group-item list-group-item-action">
Terms & Conditions
</a>

<a href="/privacy" class="list-group-item list-group-item-action">
Privacy Policy
</a>

<a href="/faq" class="list-group-item list-group-item-action">
FAQ
</a>

<a href="/report/{{ code }}" class="list-group-item list-group-item-action text-danger">
Report Link
</a>

</div>

</div>

<script>

const LINK_CODE = "{{ code }}";
const TOTAL_ADS = {{ ads }};
const DESTINATION_URL = "{{ destination_url }}";

</script>

<script src="{{ url_for('static', filename='js/unlock.js') }}"></script>

</body>
</html>
